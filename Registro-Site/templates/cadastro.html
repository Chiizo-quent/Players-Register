<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/login.css') }}">
</head>
<body>
    <div class="topo">
    <div class="login-container">
        <form action="/FazerCadastro" method="POST">
            <h1>Cadastro</h1>
            <input type="text" id="inputUsername" name="username" placeholder="Username" onkeyup="checkUser()" required>
            <input type="password" id="inputPassword" name="password" placeholder="Password" required>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
    
    </div>
    <script src="{{ url_for('static', filename='script/cadastro.js') }}"></script>
</body>
</html>
